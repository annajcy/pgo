name: ci

on:
  push:
  pull_request:

env:
  PGO_BENCHMARK_SMOKE_ARGS: --benchmark_min_time=0.1s --benchmark_repetitions=3 --benchmark_report_aggregates_only=true

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: debug,               profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest, preset: debug-asan,           profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest, preset: debug-all,            profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest, preset: debug-accel,          profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest, preset: debug-accel-all,      profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: macos-latest,   preset: debug,               profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: macos-latest,   preset: debug-asan,           profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: macos-latest,   preset: debug-all,            profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: macos-latest,   preset: debug-accel,          profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: macos-latest,   preset: debug-accel-all,      profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: windows-latest, preset: debug,               profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
          - { os: windows-latest, preset: debug-asan,           profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
          - { os: windows-latest, preset: debug-all,            profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
          - { os: windows-latest, preset: debug-accel,          profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
          - { os: windows-latest, preset: debug-accel-all,      profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: |
          uv tool install cmake
          uv tool install ninja
          uv tool install conan
          uv sync

      - name: Install oneMKL (Linux)
        if: contains(matrix.preset, 'accel') && runner.os == 'Linux'
        run: bash scripts/install-onemkl/install-onemkl-linux.sh

      - name: Install oneMKL (Windows)
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-onemkl\install-onemkl-windows.ps1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: uv run python scripts/pgo_configure.py ${{ matrix.preset }} --profile ${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  release:
    name: ${{ matrix.os }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: release,        profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest, preset: release-accel,   profile: conan/profiles/ubuntu-x86_64-gcc,     cc: gcc-13, cxx: g++-13 }
          - { os: macos-latest,   preset: release,        profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: macos-latest,   preset: release-accel,   profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++ }
          - { os: windows-latest, preset: release,        profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
          - { os: windows-latest, preset: release-accel,   profile: conan/profiles/windows-x86_64-msvc,    cc: cl,    cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: |
          uv tool install cmake
          uv tool install ninja
          uv tool install conan
          uv sync

      - name: Install oneMKL (Linux)
        if: contains(matrix.preset, 'accel') && runner.os == 'Linux'
        run: bash scripts/install-onemkl/install-onemkl-linux.sh

      - name: Install oneMKL (Windows)
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-onemkl\install-onemkl-windows.ps1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: uv run python scripts/pgo_configure.py ${{ matrix.preset }} --profile ${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Build benchmark
        run: cmake --build --preset ${{ matrix.preset }} --target pgo_benchmarks

      - name: Check oneMKL runtime DLLs
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        run: |
          where.exe mkl_core.2.dll
          where.exe mkl_intel_thread.2.dll
          where.exe libiomp5md.dll

      - name: Run benchmark
        if: runner.os != 'Windows'
        run: |
          ./build/${{ matrix.preset }}/benchmarks/pgo_benchmarks \
            --benchmark_format=json \
            ${{ env.PGO_BENCHMARK_SMOKE_ARGS }} \
            | uv run python scripts/benchmark_summary.py

      - name: Run benchmark
        if: runner.os == 'Windows'
        run: |
          .\build\${{ matrix.preset }}\benchmarks\pgo_benchmarks.exe `
            --benchmark_format=json `
            ${{ env.PGO_BENCHMARK_SMOKE_ARGS }} `
            | uv run python scripts/benchmark_summary.py

  python-api:
    name: ${{ matrix.os }} ${{ matrix.variant }} python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  variant: default, preset: pypgo-release-all,       profile: conan/profiles/ubuntu-x86_64-gcc,       cc: gcc-13, cxx: g++-13 }
          - { os: ubuntu-latest,  variant: accel,   preset: pypgo-release-accel-all, profile: conan/profiles/ubuntu-x86_64-gcc,       cc: gcc-13, cxx: g++-13 }
          - { os: macos-latest,   variant: default, preset: pypgo-release-all,       profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++  }
          - { os: macos-latest,   variant: accel,   preset: pypgo-release-accel-all, profile: conan/profiles/macos-arm64-apple-clang, cc: cc,    cxx: c++  }
          - { os: windows-latest, variant: default, preset: pypgo-release-all,       profile: conan/profiles/windows-x86_64-msvc,     cc: cl,    cxx: cl   }
          - { os: windows-latest, variant: accel,   preset: pypgo-release-accel-all, profile: conan/profiles/windows-x86_64-msvc,     cc: cl,    cxx: cl   }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install tools and Python build dependencies
        run: |
          uv tool install cmake
          uv tool install ninja
          uv tool install conan
          uv sync

      - name: Install oneMKL (Linux)
        if: matrix.variant == 'accel' && runner.os == 'Linux'
        run: bash scripts/install-onemkl/install-onemkl-linux.sh

      - name: Install oneMKL (Windows)
        if: matrix.variant == 'accel' && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-onemkl\install-onemkl-windows.ps1

      - name: Get nanobind CMake directory
        id: nanobind
        shell: bash
        run: echo "dir=$(uv run python -m nanobind --cmake_dir)" >> "$GITHUB_OUTPUT"

      - name: Build release wheel
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          nanobind_DIR: ${{ steps.nanobind.outputs.dir }}
        run: >
          uv run python scripts/pgo_release_wheels.py
          ${{ matrix.preset }}
          --profile ${{ matrix.profile }}
          --clear
          --install

      - name: Test Python API
        run: uv run pytest tests/python -q
