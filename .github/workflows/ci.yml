name: ci

on:
  push:
  pull_request:

jobs:
  build-debug:
    name: ${{ matrix.os }} debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            conan_settings: -s:h os=Linux -s:h arch=x86_64 -s:h compiler=gcc -s:h compiler.version=13 -s:h compiler.libcxx=libstdc++11 -s:h compiler.cppstd=gnu17 -s:b os=Linux -s:b arch=x86_64 -s:b compiler=gcc -s:b compiler.version=13 -s:b compiler.libcxx=libstdc++11 -s:b compiler.cppstd=gnu17
          - os: macos-latest
            conan_settings: -s:h os=Macos -s:h arch=armv8 -s:h compiler=apple-clang -s:h compiler.version=17.0 -s:h compiler.libcxx=libc++ -s:h compiler.cppstd=gnu17 -s:b os=Macos -s:b arch=armv8 -s:b compiler=apple-clang -s:b compiler.version=17.0 -s:b compiler.libcxx=libc++ -s:b compiler.cppstd=gnu17
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install Conan
        run: pipx install conan

      - name: Install dependencies
        run: conan install . --output-folder=build/conan/debug --build=missing -s:h build_type=Debug ${{ matrix.conan_settings }}

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

  sanitize:
    name: ubuntu asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install Conan
        run: pipx install conan

      - name: Install dependencies
        run: conan install . --output-folder=build/conan/debug --build=missing -s:h build_type=Debug -s:h os=Linux -s:h arch=x86_64 -s:h compiler=gcc -s:h compiler.version=13 -s:h compiler.libcxx=libstdc++11 -s:h compiler.cppstd=gnu17 -s:b os=Linux -s:b arch=x86_64 -s:b compiler=gcc -s:b compiler.version=13 -s:b compiler.libcxx=libstdc++11 -s:b compiler.cppstd=gnu17

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan
