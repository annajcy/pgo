name: ci

on:
  push:
  pull_request:

jobs:
  build-debug:
    name: ${{ matrix.os }} debug
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            cc: gcc-13
            cxx: g++-13
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            cc: cc
            cxx: c++
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install dependencies
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          conan install .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --output-folder=build/conan/debug
          --build=missing
          -s:h build_type=Debug

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  sanitize:
    name: ubuntu asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install dependencies
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          conan install .
          --profile:host=conan/profiles/ubuntu-x86_64-gcc
          --profile:build=conan/profiles/ubuntu-x86_64-gcc
          --output-folder=build/conan/debug
          --build=missing
          -s:h build_type=Debug

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

  acceleration:
    name: ${{ matrix.os }} debug acceleration
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            conan_options: ""
            cc: cc
            cxx: c++
            experimental: false
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            conan_options: "-o '&:with_mkl=True'"
            cc: gcc-13
            cxx: g++-13
            experimental: true
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            conan_options: "-o '&:with_mkl=True'"
            cc: cl
            cxx: cl
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install acceleration dependencies
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          conan install .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --output-folder=build/conan/debug-acceleration
          --build=missing
          -s:h build_type=Debug
          ${{ matrix.conan_options }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset debug-acceleration

      - name: Build
        run: cmake --build --preset debug-acceleration

      - name: Eigen acceleration smoke test
        run: ctest --preset debug-acceleration -R EigenConfig

  benchmark:
    name: ${{ matrix.os }} ${{ matrix.preset }} benchmark
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            preset: release
            conan_output: build/conan/release
            conan_options: ""
            cc: gcc-13
            cxx: g++-13
            experimental: false
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            preset: release
            conan_output: build/conan/release
            conan_options: ""
            cc: cc
            cxx: c++
            experimental: false
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            preset: release
            conan_output: build/conan/release
            conan_options: ""
            cc: cl
            cxx: cl
            experimental: false
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            preset: release-acceleration
            conan_output: build/conan/release-acceleration
            conan_options: ""
            cc: cc
            cxx: c++
            experimental: false
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            preset: release-acceleration
            conan_output: build/conan/release-acceleration
            conan_options: "-o '&:with_mkl=True'"
            cc: gcc-13
            cxx: g++-13
            experimental: true
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            preset: release-acceleration
            conan_output: build/conan/release-acceleration
            conan_options: "-o '&:with_mkl=True'"
            cc: cl
            cxx: cl
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install benchmark dependencies
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          conan install .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --output-folder=${{ matrix.conan_output }}
          --build=missing
          -s:h build_type=Release
          ${{ matrix.conan_options }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build benchmark
        run: cmake --build --preset ${{ matrix.preset }} --target pgo_benchmarks

      - name: Run benchmark smoke
        if: runner.os != 'Windows'
        run: ./build/${{ matrix.preset }}/benchmarks/pgo_benchmarks --benchmark_min_time=0.01s --benchmark_repetitions=1

      - name: Run benchmark smoke
        if: runner.os == 'Windows'
        run: .\build\${{ matrix.preset }}\benchmarks\pgo_benchmarks.exe --benchmark_min_time=0.01s --benchmark_repetitions=1
