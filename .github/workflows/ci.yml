name: ci

on:
  push:
  pull_request:

jobs:
  build-debug:
    name: ${{ matrix.os }} debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            conan_profile: ubuntu-x86_64-gcc
          - os: macos-latest
            conan_profile: macos-arm64-apple-clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install dependencies
        run: conan install . --profile:host=conan/profiles/${{ matrix.conan_profile }} --profile:build=conan/profiles/${{ matrix.conan_profile }} --output-folder=build/conan/debug --build=missing -s:h build_type=Debug

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

  sanitize:
    name: ubuntu asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install dependencies
        run: conan install . --profile:host=conan/profiles/ubuntu-x86_64-gcc --profile:build=conan/profiles/ubuntu-x86_64-gcc --output-folder=build/conan/debug --build=missing -s:h build_type=Debug

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan
