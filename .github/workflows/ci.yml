name: ci

on:
  push:
  pull_request:

env:
  PGO_BENCHMARK_SMOKE_ARGS: --benchmark_min_time=0.1s --benchmark_repetitions=3 --benchmark_report_aggregates_only=true

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - debug-asan
          - debug-all
          - debug-accel
          - debug-accel-all
        include:
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            cc: gcc-13
            cxx: g++-13
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            cc: cc
            cxx: c++
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install oneMKL (Linux)
        if: contains(matrix.preset, 'accel') && runner.os == 'Linux'
        run: bash scripts/install-onemkl/install-onemkl-linux.sh

      - name: Install oneMKL (Windows)
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-onemkl\install-onemkl-windows.ps1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: uv run python scripts/pgo_configure.py ${{ matrix.preset }} --profile ${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  release:
    name: ${{ matrix.os }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        preset:
          - release
          - release-accel
        include:
          - os: ubuntu-latest
            profile: conan/profiles/ubuntu-x86_64-gcc
            cc: gcc-13
            cxx: g++-13
          - os: macos-latest
            profile: conan/profiles/macos-arm64-apple-clang
            cc: cc
            cxx: c++
          - os: windows-latest
            profile: conan/profiles/windows-x86_64-msvc
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install GCC 13
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Conan
        run: uv tool install conan

      - name: Install oneMKL (Linux)
        if: contains(matrix.preset, 'accel') && runner.os == 'Linux'
        run: bash scripts/install-onemkl/install-onemkl-linux.sh

      - name: Install oneMKL (Windows)
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install-onemkl\install-onemkl-windows.ps1

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: uv run python scripts/pgo_configure.py ${{ matrix.preset }} --profile ${{ matrix.profile }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Build benchmark
        run: cmake --build --preset ${{ matrix.preset }} --target pgo_benchmarks

      - name: Check oneMKL runtime DLLs
        if: contains(matrix.preset, 'accel') && runner.os == 'Windows'
        run: |
          where.exe mkl_core.2.dll
          where.exe mkl_intel_thread.2.dll
          where.exe libiomp5md.dll

      - name: Run benchmark smoke
        if: runner.os != 'Windows'
        run: ./build/${{ matrix.preset }}/benchmarks/pgo_benchmarks ${{ env.PGO_BENCHMARK_SMOKE_ARGS }}

      - name: Run benchmark smoke
        if: runner.os == 'Windows'
        run: .\build\${{ matrix.preset }}\benchmarks\pgo_benchmarks.exe ${{ env.PGO_BENCHMARK_SMOKE_ARGS }}
